spring:
  application:
    name: garage-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=garage;encrypt=true;trustServerCertificate=false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-init-sql: "SET ANSI_NULLS ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON; SET ARITHABORT ON; SET CONCAT_NULL_YIELDS_NULL ON; SET QUOTED_IDENTIFIER ON; SET NUMERIC_ROUNDABORT OFF; SET XACT_ABORT OFF; SET LOCK_TIMEOUT 5000"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
        path: /

garage:
  timezone: Asia/Ho_Chi_Minh
  public:
    trusted-proxies: ${PUBLIC_TRUSTED_PROXIES:}
  identity:
    bootstrap:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
